<!-- src/app/component/raizan-settings-modal/raizan-settings-modal.component.html -->
<div class="overlay">
  <div class="modal" (click)="$event.stopPropagation()">

    <div class="header">
      <div class="title">雷山設定</div>
      <button type="button" class="x" (click)="onClickClose()">×</button>
    </div>

    <!-- ★スクロール領域 -->
    <div class="body">
      <div class="row row--mode">
        <label>モード</label>
        <select [(ngModel)]="selectedBattleMode">
          <option *ngFor="let mode of battleModes" [ngValue]="mode">{{ mode }}</option>
        </select>
      </div>

      <!-- 音無 / 言霊 -->
      <section class="pane">
        <div class="paneTitle">音無 &amp; 言霊</div>

        <div class="pieceGrid">
          <div class="pieceCard" *ngFor="let piece of otonashiPieces">
            <img class="pieceImg"
                 [src]="'assets/images/raigo/koma/' + piece.name + '.jpg'"
                 [alt]="piece.name" />

            <div class="countRow">
              <span class="countLabel">使用数</span>
              <select class="countSelect"
                      [ngModel]="piece.countInGame"
                      (ngModelChange)="onChangeCount(piece, $event)">
                <option *ngFor="let c of countOptions" [ngValue]="c">{{ c }}</option>
              </select>
            </div>
          </div>

          <div class="pieceCard" *ngFor="let piece of kotodamaPieces">
            <img class="pieceImg"
                 [src]="'assets/images/raigo/koma/' + piece.name + '.jpg'"
                 [alt]="piece.name"
                  [title]="piece.text || ''" />

            <div class="countRow">
              <span class="countLabel">使用数</span>
              <select class="countSelect"
                      [ngModel]="piece.countInGame"
                      (ngModelChange)="onChangeCount(piece, $event)">
                <option *ngFor="let c of countOptions" [ngValue]="c">{{ c }}</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <!-- 奥義 -->
      <section class="pane">
        <div class="paneTitle">
          奥義
          <span class="sub">該当 {{ filteredOugiPieces.length }} / {{ ougiPieces.length }}</span>
        </div>

        <div class="row row--search">
          <label>検索</label>
          <input type="text"
                 [(ngModel)]="ougiSearchTerm"
                 placeholder="ひらがなで入力（例：げき）" />
        </div>

        <div class="ougiGrid">
          <button type="button"
                  class="ougiBtn"
                  *ngFor="let piece of filteredOugiPieces"
                  (click)="toggleOugi(piece)"
                  [title]="piece.text || ''" >
            <img class="ougiImg"
                 [src]="'assets/images/raigo/koma/' + piece.name + '.jpg'"
                 [alt]="piece.name"
                 [class.disabled]="piece.countInGame === 0" />
          </button>
        </div>
      </section>
    </div>

    <!-- ★常に下に固定される -->
    <div class="footer">
      <button type="button" class="btn" (click)="onClickClose()">閉じる</button>
      <button type="button" class="btn" (click)="onClickPlaceToTsuki()">月に置く</button>
      <button type="button" class="btn primary" (click)="onClickSave()">雷山生成</button>
    </div>

  </div>
</div>
