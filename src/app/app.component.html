<div id="app-table-layer" style="position: absolute; width: 100%; height: 100%; overflow: hidden;">
  <game-table></game-table>
</div>

<ui-panel [top]="0" [left]="0" [width]="120" [height]="140" [title]="'メニュー'" [showTitleButtons]="false">
  <nav>
    <ul>

      <li (click)="open('LobbyComponent')" title="メニュー" aria-label="メニュー">
        <a routerLink="/" routerLinkActive="active">
          <div><i class="fas fa-user-plus"></i></div>
        </a>
      </li>

      <li (click)="openRaizanSettings()" title="ゲーム開始" aria-label="ゲーム開始">
        <a>
          <div><i class="fa-solid fa-play"></i></div>
        </a>
      </li>

      <li (click)="openSheetEditor()" title="大会エントリー" aria-label="大会エントリー">
        <a>
          <div><i class="fa-solid fa-torii-gate torii-icon"></i></div>
        </a>
      </li>

      <li title="チャット" aria-label="チャット">
        <a (click)="open('ChatWindowComponent')">
          <div class="menu-icon-with-badge">
            <div><i class="fas fa-comments"></i></div>
            <span *ngIf="unreadChatCount > 0" class="menu-badge">
              {{ unreadChatCount }}
            </span>
          </div>
        </a>
      </li>



      <!-- ★チェスクロック -->
      <li (click)="uploadTournamentResultMenu()" title="結果報告" aria-label="結果報告">
        <a>
          <div><i class="fa-solid fa-upload"></i></div>
        </a>
      </li>

      <li *ngIf="isSpectator" (click)="onClickLeaveSpectator()" title="観戦中" aria-label="観戦中">
        <a>
          <div><i class="far fa-eye"></i></div>
        </a>
      </li>

      <li *ngIf="!isSpectator" (click)="onClickBecomeSpectator()" title="観戦する" aria-label="観戦する">
        <a>
          <div><i class="far fa-eye-slash"></i></div>
        </a>
      </li>

      <li title="ルールブック" aria-label="ルールブック">
        <a (click)="open('')" href="https://raigonarium.velvet.jp/RediGames/rulebook/viewer/index.html" target="_blank">
          <div><i class="fas fa-book-open"></i></div>
        </a>
      </li>

      <li (click)="open('JukeboxComponent')" title="音量調整" aria-label="音量調整">
        <a routerLink="/" routerLinkActive="active">
          <div><i class="fas fa-volume-up"></i></div>
        </a>
      </li>
      <li (click)="openRaigoPortal()" title="雷轟ポータル" aria-label="雷轟ポータル">
        <a>
          <div><i class="fa-solid fa-satellite"></i></div>
        </a>
      </li>

    </ul>
  </nav>
</ui-panel>

<div #modalLayer></div>

<app-raizan-settings-modal *ngIf="showRaizanSettings"
                           [otonashiPieces]="otonashiPieces"
                           [kotodamaPieces]="kotodamaPieces"
                           [ougiPieces]="ougiPieces"
                           (save)="onraizanSettingsSave($event)"
                           (placeToTsuki)="onPlaceOugiToTsuki($event)"
                           (close)="closeRaizanSettings()"></app-raizan-settings-modal>

<app-sheet-editor-modal *ngIf="showSheetEditor"
                        (close)="closeSheetEditor()">
</app-sheet-editor-modal>

<network-indicator class="networkIndicator"></network-indicator>
