<div id="app-table-layer" style="position: absolute; width: 100%; height: 100%; overflow: hidden;">
  <game-table></game-table>
</div>
<ui-panel [top]="0" [left]="0" [width]="100" [height]="470" [title]="'メニュー'" [showTitleButtons]="false">

    <ul>
      <li *ngIf="isSpectator" (click)="onClickLeaveSpectator()">
        <a>
          <div><i class="far fa-eye"></i></div>
          <div>観戦中</div>
        </a>
      </li>
      <li *ngIf="!isSpectator" (click)="onClickBecomeSpectator()">

              {{ unreadChatCount }}
            </span>
          </div>
